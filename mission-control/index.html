<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codestra Mission Control</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:#071018;color:#e9f2f8}a{color:#8fc6ff;text-decoration:none}header{position:sticky;top:0;z-index:5;padding:18px 22px;background:#071018f2;border-bottom:1px solid #213647}h1{margin:0}.muted,.tiny{color:#8da6b8}.tiny{font-size:12px}.wrap{max-width:1900px;margin:auto;padding:18px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.ops{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.card{background:#0e1b26;border:1px solid #213647;border-radius:12px;padding:14px}.kpi b{font-size:26px;display:block}.red{color:#ff6b6b}.yellow{color:#f6c95f}.green{color:#42d392}.blue{color:#6aaeff}.section{margin-top:18px}.alerts,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #213647;border-radius:999px;padding:5px 8px}.pill.critical{color:#ff9d9d;border-color:#6d2c2c}.pill.warning{color:#f6d57b;border-color:#66552a}input,select{background:#0a1721;border:1px solid #213647;color:#e9f2f8;padding:9px;border-radius:8px}input{min-width:280px}.tablewrap{overflow:auto;border:1px solid #213647;border-radius:12px;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:1500px}th,td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #172a38}th{position:sticky;top:70px;background:#0b1822;color:#a8bdcb}.repo{font-weight:700}.blocked{color:#ff6b6b;font-weight:700}.error{padding:20px;color:#ff9d9d}
</style></head><body>
<header><h1>Codestra Mission Control</h1><div class="muted" id="stamp">Loading authoritative snapshot…</div></header>
<div class="wrap"><div id="error" class="error" hidden></div><div id="app" hidden>
<div class="grid kpis" id="kpis"></div>
<div class="section"><h2>Live operations</h2><div class="grid ops" id="ops"></div><div class="alerts" id="alerts"></div></div>
<div class="section"><h2>Repository mission queue</h2><div class="toolbar"><input id="search" placeholder="Search repo, mission, branch, blocker…"><select id="filter"><option value="">All states</option><option value="blocked">Blocked/conflict</option><option value="dirty">Dirty local</option><option value="behind">Behind upstream</option><option value="In Progress">In Progress</option><option value="In Review">In Review</option><option value="Todo">Todo</option><option value="Unlinked">Unlinked</option></select><select id="group"><option value="">All groups</option><option value="core">Core</option><option value="monitoring">Monitoring</option><option value="saas">Apps/SaaS</option></select></div><div class="tablewrap"><table><thead><tr><th>Repository</th><th>Goal / Linear mission</th><th>Status</th><th>Open PRs</th><th>Conflict / blocker</th><th>Local Git</th><th>Latest commit / daily work</th><th>Actions</th></tr></thead><tbody id="repoRows"></tbody></table></div></div>
</div></div>
<script>
let SNAP=null,DATA=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(value,label,cls='blue')=>`<div class="card kpi"><b class="${cls}">${esc(value)}</b><span class="muted">${esc(label)}</span></div>`;
function makeRow(r){let l='<span class="muted">No local clone/state</span>';if(r.local){l='<b>'+esc(r.local.branch||'HEAD')+'</b> @ '+esc(r.local.head||'—')+'<div class="tiny">'+esc(r.local.path||'')+'</div><div>'+(r.dirtyFiles?'<span class="red">'+r.dirtyFiles+' dirty</span>':'<span class="green">clean</span>')+' · behind '+esc(r.maxBehind)+' · ahead '+esc(r.maxAhead)+' · '+esc(r.worktreeCount)+' worktree(s)</div>';}const ps=(r.prs&&r.prs.length)?r.prs.map(p=>'<div><a href="'+esc(p.url)+'">#'+p.number+' '+esc(p.title)+'</a></div>').join(''):'<a href="'+esc(r.github)+'/pulls">'+esc(r.openPrs||0)+' indexed · open PRs</a>';const b=r.blocked?'<a class="blocked" href="'+esc(r.blockerUrl)+'">'+esc(r.blocker)+'</a>':'<span class="green">No linked conflict</span>';const last=r.local?.last_commit?String(r.local.last_commit).split('|').map(esc).join('<br>'):'<span class="muted">Unavailable</span>';return '<tr><td><div class="repo"><a href="'+esc(r.github)+'">'+esc(r.name)+'</a></div><div class="tiny">'+esc(r.visibility)+' · '+esc(r.group)+'</div></td><td><a href="'+esc(r.linearUrl)+'">'+esc(r.linearIssue)+' '+esc(r.goal)+'</a></td><td>'+esc(r.linearStatus)+'<div class="tiny">'+esc(r.assignee||'Unassigned')+'</div></td><td>'+ps+'</td><td>'+b+'</td><td>'+l+'</td><td class="tiny">'+last+'</td><td><a href="'+esc(r.notionUrl||SNAP.sources.notion)+'">Notion</a> · <a href="'+esc(r.github)+'/pulls">PRs</a> · <a href="'+esc(r.github)+'/actions">CI</a></td></tr>'}
function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,g=document.getElementById('group').value;const list=DATA.filter(r=>{const hay=[r.name,r.goal,r.linearStatus,r.blocker,r.local?.branch,r.local?.head].join(' ').toLowerCase();if(q&&!hay.includes(q))return false;if(g&&r.group!==g)return false;if(f==='blocked'&&!r.blocked)return false;if(f==='dirty'&&!r.dirtyFiles)return false;if(f==='behind'&&!(Number(r.maxBehind)>0))return false;if(f&&!['blocked','dirty','behind'].includes(f)&&r.linearStatus!==f)return false;return true});document.getElementById('repoRows').innerHTML=list.map(makeRow).join('')}
async function boot(){try{const res=await fetch('snapshot.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('snapshot.json HTTP '+res.status);SNAP=await res.json();DATA=SNAP.repositories||[];const s=SNAP.summary,m=SNAP.monitoring;document.getElementById('stamp').textContent='GitHub · Linear · Notion · Local Git · Prometheus · Alertmanager · Grafana · SentinelX — '+SNAP.generatedAt;document.getElementById('kpis').innerHTML=card(s.repositories,'Repositories')+card(s.openPrsIndexed,'Open PRs indexed')+card(s.linearIssues,'Linear issues')+card(s.inProgress,'In progress','yellow')+card(s.inReview,'In review','yellow')+card(s.blockedIssues,'Blocked / conflict','red')+card(s.reposWithDirtyWork,'Dirty local repos','red')+card(s.criticalAlerts,'Critical alerts','red');document.getElementById('ops').innerHTML=`<div class="card"><b>Codestra Prometheus</b><div class="green">${m.codestra.prometheus.targets_up}/${m.codestra.prometheus.targets_total} targets up</div></div><div class="card"><b>Alertmanager</b><div class="red">${s.activeAlerts} active · ${s.criticalAlerts} critical</div></div><div class="card"><b>Klyrow Prometheus</b><div class="green">${m.klyrow.prometheus.targets_up}/${m.klyrow.prometheus.targets_total} targets up</div></div><div class="card"><b>Telnexa Prometheus</b><div class="green">${m.telnexa.prometheus.targets_up}/${m.telnexa.prometheus.targets_total} targets up</div></div>`;document.getElementById('alerts').innerHTML=(SNAP.alerts||[]).map(a=>`<span class="pill ${esc(a.severity)}">${esc(a.severity)} · ${esc(a.name)}</span>`).join('');document.getElementById('app').hidden=false;document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',render));render()}catch(e){const el=document.getElementById('error');el.hidden=false;el.textContent='Mission Control snapshot could not be loaded: '+e.message}}
boot();
</script></body></html>
