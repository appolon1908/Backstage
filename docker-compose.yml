name: codestra-backstage
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: backstage
    volumes:
      - backstage_postgres:/var/lib/postgresql/data
    networks: [backstage_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage -d backstage"]
      interval: 10s
      timeout: 5s
      retries: 12
  backstage:
    image: ghcr.io/backstage/backstage@sha256:0979a2355650b0ac5f085e4c250c3ff5925ad61ba2b749354ec122da6e1557bf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "10.40.0.4:17007:7007"
    volumes:
      - ./app-config.production.yaml:/app/app-config.production.yaml:ro
      - ./catalog:/app/catalog:ro
    networks: [backstage_private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7007/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
networks:
  backstage_private:
volumes:
  backstage_postgres:
